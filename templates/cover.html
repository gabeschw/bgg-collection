<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bgg_username }} — Board Game Collection</title>
    <style>
    :root {
        --ink: #3f3f3f;
        --bg: #ffffff;
        --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    * {
        box-sizing: border-box;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;  /* keep the mosaic + frosted panel when printing */
    }
    body {
        margin: 0;
        background: #ffffff;
        color: var(--ink);
        font-family: "Charter", "Georgia", serif;
        font-weight: 400;
    }
    main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    .page {
        width: 210mm;
        height: 297mm;
        padding: 0;
        background: var(--bg, #ffffff);
        position: relative;
        box-shadow: 0 3px 14px rgba(0,0,0,0.18);
    }

    /* Full-bleed mosaic: game covers flow left-to-right, top-to-bottom. */
    .mosaic {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat({{ cols }}, minmax(0, 1fr));
        grid-template-rows: repeat({{ rows }}, minmax(0, 1fr));
        gap: 0;
    }
    .mosaic img {
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
        display: block;
    }

    .panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        background: rgba(255,255,255,0.88);
        border-radius: 6px;
        padding: 26px 44px;
        box-shadow: 0 3px 18px rgba(0,0,0,0.15);
        text-align: center;
        max-width: 78%;
    }
    .panel .eyebrow {
        font-family: var(--sans);
        font-size: 0.72em;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #6d6d6d;
        margin-bottom: 14px;
    }
    .panel h1 {
        font-family: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
        font-size: 2.6em;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--ink);
        margin: 0 0 12px;
    }
    .panel p {
        font-family: var(--sans);
        color: #6d6d6d;
        font-size: 0.85em;
        line-height: 1.5;
        margin: 0;
    }

    @media print {
        body { background: #fff; }
        main { display: block; min-height: 0; padding: 0; }
        @page { size: A4 portrait; margin: 0; }
        .page { box-shadow: none; margin: 0; }
    }
    </style>
</head>
<body>
    <main>
        <section class="page">
            <div class="mosaic">
                {% for c in cards %}
                <img alt="{{ c.name }}" src="{{ c.image }}" loading="lazy">
                {% endfor %}
            </div>
            <div class="panel">
                <!-- <div class="eyebrow">Reference &amp; Selection Guide</div> -->
                <h1>{{ title }}</h1>
                {% if subtitle %}<p>{{ subtitle }}</p>{% else %}
                <p>{{ bgg_username }} &middot; {{ card_count }} games &middot; updated {{ last_update_date }}</p>{% endif %}
            </div>
        </section>
    </main>
</body>
</html>
